spring:
  datasource:
    url: jdbc:h2:mem:env_monitor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
