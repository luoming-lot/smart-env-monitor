server:
  port: 8080

spring:
  application:
    name: env-monitor
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/env_monitor?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:iot}
    password: ${MYSQL_PASSWORD:iot123456}
  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 Flyway 迁移管理
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:env-monitor-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-filter: ${MQTT_TOPIC_FILTER:env/+/telemetry}

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖（至少 32 字节）
    secret: ${JWT_SECRET:env-monitor-default-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

logging:
  level:
    com.iot.envmonitor: INFO
