# Render Blueprint：一键部署整套平台（免费档单服务演示模式）
# 前端已打包进后端 jar；内置演示数据模拟器，无需 MySQL / MQTT 外部服务。
# 完整 MQTT + ESP32 链路请使用 docker compose 或本地部署（见 docs/deployment.md）。
services:
  - type: web
    name: env-monitor
    runtime: docker
    repo: https://github.com/luoming-lot/smart-env-monitor
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: TZ
        value: Asia/Shanghai
      - key: JWT_SECRET
        generateValue: true
