version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: env-monitor-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: env-monitor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: env_monitor
      MYSQL_USER: iot
      MYSQL_PASSWORD: iot123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: env-monitor-backend
    environment:
      TZ: Asia/Shanghai
      MYSQL_URL: jdbc:mysql://mysql:3306/env_monitor?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      MYSQL_USER: iot
      MYSQL_PASSWORD: iot123456
      MQTT_BROKER_URL: tcp://mosquitto:1883
      CORS_ALLOWED_ORIGINS: http://localhost
      JWT_SECRET: ${JWT_SECRET:-env-monitor-default-secret-key-change-me-in-production-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: env-monitor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
